{% extends "base.html" %}

{% block title %}Logowanie{% endblock %}

{% block content %}
<div class="box">
    <h2>Logowanie</h2>
    {% if form.errors %}
    <p class="blad">Zły login lub hasło</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Login</label>
        <input type="text" name="username" required autofocus>
        <label>Hasło</label>
        <input type="password" name="password" required>
        <button type="submit">Zaloguj</button>
    </form>
    <p>Nie masz konta? <a href="{% url 'rejestracja' %}">Zarejestruj się</a></p>
</div>
{% endblock %}
