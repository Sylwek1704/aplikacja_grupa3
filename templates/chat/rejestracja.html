{% extends "base.html" %}

{% block title %}Rejestracja{% endblock %}

{% block content %}
<div class="box">
    <h2>Rejestracja</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label>{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
                <p class="blad">{{ error }}</p>
            {% endfor %}
        {% endfor %}
        <button type="submit">Załóż konto</button>
    </form>
    <p>Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a></p>
</div>
{% endblock %}
